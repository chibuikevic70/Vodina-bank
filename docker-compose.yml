services:
  postgres:
    image: postgres:16-alpine
    container_name: vodina-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: vodina
      POSTGRES_PASSWORD: vodina
      POSTGRES_DB: vodina

    ports:
      - "5432:5432"

    volumes:
      - vodina_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_vodina_core.sql:/docker-entrypoint-initdb.d/001_vodina_core.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vodina -d vodina"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile

    container_name: vodina-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://vodina:vodina@postgres:5432/vodina?sslmode=disable

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vodina_postgres_data:
